services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: zetesis-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zetesis}:${POSTGRES_PASSWORD:-zetesis}@db:5432/${POSTGRES_DB:-zetesis}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  db:
    image: pgvector/pgvector:pg17
    container_name: zetesis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zetesis}
      POSTGRES_USER: ${POSTGRES_USER:-zetesis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zetesis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zetesis} -d ${POSTGRES_DB:-zetesis}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
